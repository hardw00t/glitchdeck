name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ "$TAG" =~ $semver ]]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tag.outputs.release == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: steps.tag.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.release == 'true'
        with:
          node-version: 22
      - name: Verify
        if: steps.tag.outputs.release == 'true'
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted"
          go vet ./...
          go test -race ./...
          node --test internal/ui/model.test.mjs
      - name: Package
        if: steps.tag.outputs.release == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package.sh "${TAG#v}" dist
      - name: Publish
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
