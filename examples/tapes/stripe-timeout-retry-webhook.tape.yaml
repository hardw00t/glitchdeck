# Expected test exit: 1 (duplicate reproduced)
version: 2
name: stripe-timeout-retry-webhook
target: demo
rules:
  - id: duplicate
    enabled: true
    match: {method: POST, path_prefix: /webhooks/payment}
    fault: {type: dup-webhook, params: {mode: timeout_retry, count: 2}}
script:
  - name: webhook
    http:
      method: POST
      path: /webhooks/payment
      headers: {Content-Type: application/json}
      body: '{"order_id":"ord-1","amount_cents":4900}'
assertions:
  - name: no-duplicate
    http_get: /api/state
    json_eq: {duplicate_charges: 0}
