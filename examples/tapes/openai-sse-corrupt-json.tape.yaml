# Expected test exit: 0; exec exit: depends on child and traffic.
version: 2
name: openai-sse-corrupt-json
target: demo
rules:
  - id: corrupt
    enabled: true
    match: {path_prefix: /api/chat/stream}
    fault: {type: sse-glitch, params: {action: corrupt_json, events: [4], mode: cut}}
script:
  - name: chat
    stream: {method: POST, path: /api/chat/stream, body: '{"tokens":8,"token_ms":1}'}
assertions:
  - {name: corrupt, stream_step: chat, expect_sse: {end: done, valid_json: false}}
