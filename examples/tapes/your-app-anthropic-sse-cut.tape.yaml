# A clean cut after 3 events can return a silent short answer; assert stop_reason.
version: 2
name: your-app-anthropic-sse-cut
# For a different app port, pass --target http://127.0.0.1:<port> to exec.
target: http://127.0.0.1:3000
rules:
  - id: anthropic-stream-cut
    enabled: true
    match: {method: POST, path_prefix: /v1/messages}
    fault: {type: sse-glitch, params: {action: eof_early, after_events: 3, http_clean: true}}
expect:
  faults: [{rule: anthropic-stream-cut, min_applied: 1}]
