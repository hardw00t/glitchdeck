version: 2
name: openai-sse-gzip-corrupt
target: demo
rules:
  - id: corrupt
    enabled: true
    match: {method: POST, path_prefix: /v1/chat/completions}
    fault: {type: sse-glitch, params: {action: corrupt_json, events: [4]}}
script:
  - {name: chat, stream: {method: POST, path: /v1/chat/completions, body: '{"tokens":8,"token_ms":1,"gzip":true}'}}
expect:
  faults: [{rule: corrupt, min_applied: 1}]
assertions:
  - {name: corrupt, stream_step: chat, expect_sse: {valid_json: false}}
