version: 2
name: gemini-sse-eof-before-finish
target: demo
rules:
  - id: cut
    enabled: true
    match: {method: POST, path_prefix: /v1beta/models/}
    fault: {type: sse-glitch, params: {action: eof_early, http_clean: true}}
script:
  - {name: chat, stream: {method: POST, path: '/v1beta/models/demo:streamGenerateContent?alt=sse', body: '{"tokens":8,"token_ms":1}'}}
expect:
  faults: [{rule: cut, min_applied: 1}]
assertions:
  - {name: truncated, stream_step: chat, expect_sse: {terminal: none}}
