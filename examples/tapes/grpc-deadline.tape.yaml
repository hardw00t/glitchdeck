# Expected test exit: 0 (deadline status detected); exec exit depends on child and traffic.
version: 2
name: grpc-deadline
seed: 7
target: demo
rules:
  - id: deadline
    enabled: true
    match: {path_prefix: /glitchdeck.demo.v1.Quotes/, proto: h2}
    fault: {type: grpc-glitch, params: {code: DEADLINE_EXCEEDED, delay_ms: 20}}
script:
  - name: quote
    grpc: {path: /glitchdeck.demo.v1.Quotes/Get, message_b64: CgRBQ01F, timeout_ms: 2000, proto: h2c}
assertions:
  - name: deadline-observed
    grpc_step: quote
    expect_grpc_status: 4
