version: 2
name: openai-sse-midstream-error
target: demo
rules:
  - id: error
    enabled: true
    match: {method: POST, path_prefix: /v1/chat/completions}
    fault: {type: sse-glitch, params: {action: inject_error, after_events: 3, provider: openai}}
script:
  - {name: chat, stream: {method: POST, path: /v1/chat/completions, body: '{"tokens":8,"token_ms":1}'}}
expect:
  faults: [{rule: error, min_applied: 1}]
assertions:
  - {name: error, stream_step: chat, expect_sse: {terminal: error, done: false}}
