version: 1
name: clean-checkout
seed: 42
target: demo
rules: []
script:
  - name: trigger-payment-webhook
    http:
      method: POST
      path: /webhooks/payment
      headers: {Content-Type: application/json}
      body: '{"order_id":"ord-101","amount_cents":4900}'
assertions:
  - name: one-charge
    http_get: /api/state
    expect_status: 200
    json_eq:
      duplicate_charges: 0
      total_charged_cents: 4900
      ws_broken: false
